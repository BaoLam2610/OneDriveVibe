[versions]
agp = "9.1.1"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"
androidx-activity = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-core = "1.19.0"
androidx-biometric = "1.1.0"
androidx-datastore = "1.2.1"
androidx-lifecycle = "2.11.0"
# Bản androidx (không phải JetBrains) của lifecycle, chỉ dùng cho lifecycle-viewmodel-navigation3 trong :androidApp.
androidx-lifecycle-nav3 = "2.11.0"
androidx-navigation3 = "1.2.0"
# Paging 3 (KMP) cho tab Thư viện (Lát 4): đọc Room theo trang thay vì nạp cả danh sách.
androidx-paging = "3.5.1"
# Cần kiểm tra phiên bản mới nhất, và hỗ trợ trang bộ nhớ 16 KB, khi cập nhật (ADR-0014).
argon2kt = "1.6.0"
# Room 3 (nâng từ 2.8.5 để thử khắc phục SIGSEGV trong libsqliteJni lúc applyPage; xem ADR-0007).
androidx-room = "3.0.3"
# Phải khớp bản sqlite mà Room kéo theo (room3-runtime 3.0.3 kéo sqlite 2.7.1).
androidx-sqlite = "2.7.1"
coil = "3.6.3"
# Telephoto (Lát 5): zoom/pan + subsampling ảnh lớn. Bản 0.19.0 dùng với Coil 3; kiểm tra khớp Coil/Compose khi build.
telephoto = "0.19.0"
# Media3 (Lát 6): phát video stream + SimpleCache. Chưa tra bản mới nhất; kiểm tra khi build (media3-ui-compose cần từ 1.6 trở lên).
androidx-media3 = "1.8.0"
composeMultiplatform = "1.12.1"
koin = "4.2.2"
kermit = "2.2.0"
kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
ksp = "2.3.12"
ktor = "3.6.0"
material3 = "1.12.0-alpha03"

[libraries]
# Chỉ dùng trong :build-logic (convention plugin)
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# ADR-0009: đã bỏ junit, kotlin-test, androidx-test-ext, espresso vì dự án không viết test tự động.
# ADR-0011: đã bỏ compose-components-resources; chuỗi nằm trong Android res/ (values, values-en), không dùng Res của Compose Multiplatform.
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }

# Kermit (log, KMP). Bản debug thêm LogWriter đẩy vào màn Debug; bản release không ghi gì (ADR-0012).
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }

# kotlinx.serialization (ADR-0006; route của Navigation 3)
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Koin (ADR-0004). Ghi version trực tiếp (không dùng BOM) để dùng được cả trong module KMP.
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-core-viewmodel = { module = "io.insert-koin:koin-core-viewmodel", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# Navigation 3 (ADR-0003). :androidApp là module Android thuần nên dùng bản androidx.
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidx-navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle-nav3" }

# Ktor (ADR-0006): OkHttp engine trên Android. Gắn vào :core:network ở Lát 1.
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Bảo mật PIN (ADR-0008, ADR-0014). argon2kt: Argon2id native, chỉ androidMain của :core:security.
# biometric và lifecycle-process: gắn vào :androidApp ở Lát 2 (sinh trắc học, tự khóa khi rời app).
argon2kt = { module = "com.lambdapioneer.argon2kt:argon2kt", version.ref = "argon2kt" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidx-biometric" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle-nav3" }

# Room KMP (ADR-0007). Gắn vào :core:database ở Lát 3.
androidx-room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "androidx-room" }
androidx-room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "androidx-room" }
# room3-paging sinh PagingSource cho truy vấn DAO (Lát 4). Cùng phiên bản Room.
androidx-room-paging = { module = "androidx.room3:room3-paging", version.ref = "androidx-room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }

# Paging 3 (KMP). paging-common cho domain/data/viewmodel; paging-compose cho giao diện Android.
androidx-paging-common = { module = "androidx.paging:paging-common", version.ref = "androidx-paging" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "androidx-paging" }

# Coil 3 (Lát 4): tải thumbnail. Không dùng coil-network-ktor3 vì Graph trả chuyển hướng (xem GraphThumbnailFetcher).
coil-core = { module = "io.coil-kt.coil3:coil-core", version.ref = "coil" }
# SingletonImageLoader nằm ở artifact `coil` (không phải coil-core); chỉ :androidApp dùng để đặt ImageLoader toàn app.
coil-singleton = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
# GIF động (AN-06, Lát 5). Đăng ký decoder trong ImageLoader của :androidApp.
coil-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil" }
# Telephoto (Lát 5): ZoomableAsyncImage cho Coil 3, chạm đúp/pinch/pan, subsampling theo vùng (AN-02, AN-06).
telephoto-zoomable-image-coil3 = { module = "me.saket.telephoto:zoomable-image-coil3", version.ref = "telephoto" }

# Media3 (Lát 6): ExoPlayer + SimpleCache + DataSource cho video (VD-11, VD-14); ui-compose cho PlayerSurface (TextureView để zoom ở 6b).
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "androidx-media3" }
androidx-media3-uiCompose = { module = "androidx.media3:media3-ui-compose", version.ref = "androidx-media3" }

# DataStore Preferences (kế hoạch MVP1 mục 3). Gắn vào module cần lưu cài đặt khi dùng tới.
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room3", version.ref = "androidx-room" }
